[project]
name = "ojo-de-dios"
version = "2.0.0"
description = "Ojo de Dios / NNC Consola — sky anomaly exclusion API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "httpx>=0.27.0",
  "sgp4>=2.23",
  "skyfield>=1.49",
  "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
